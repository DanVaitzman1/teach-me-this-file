<!doctype html><html><head><meta charset="utf-8"><style>body{font:24px Georgia;background:white;color:#111;margin:0;padding:55px;width:700px;box-sizing:border-box}h1{font-size:34px}h2{font-size:26px;margin-top:45px}p{line-height:1.6}table{border-collapse:collapse;width:100%;font:22px Arial}td,th{border:2px solid #333;padding:14px;text-align:center}.fraction{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center}.fraction span:first-child{border-bottom:2px solid}</style></head><body><h1>Powers, fractions and a class table</h1><p>A power repeats multiplication:<br>3<sup>2</sup> = 3 × 3 = 9.<br>2<sup>3</sup> = 2 × 2 × 2 = 8.</p><p>A fraction is part of a whole:<br><span class="fraction"><span>3</span><span>4</span></span> + <span class="fraction"><span>1</span><span>4</span></span> = 1.</p><h2>Unsolved practice</h2><p>4<sup>2</sup> = ?<br>6<sup>2</sup> = ?</p><h2>Books read this term</h2><table><tr><th>Student</th><th>Books</th></tr><tr><td>Maya</td><td>12</td></tr><tr><td>Omar</td><td>18</td></tr><tr><td>Lina</td><td>9</td></tr></table><p>Compare values using the table.</p></body></html>
